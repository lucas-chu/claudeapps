name: claudetutorial

on:
  # `pull_request` already covers branches with an open PR, so pushes only need
  # to fire on main - otherwise every push to a PR branch runs twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: claudetutorial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claudetutorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: claudetutorial/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt pytest
      # No network, no API key - covers smoke_test.py's dependency and
      # .env handling. The numbered scripts' live API calls are run by hand.
      - name: Run tests
        run: pytest -q
