name: tests

on:
  # `pull_request` already covers branches with an open PR, so pushes only need
  # to fire on main - otherwise every push to a PR branch runs twice.
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkclaude
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: checkclaude/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No network, no API keys - the suite covers the logic that must not
      # fail open. The live agent path is tests/smoke_agent.py, run by hand.
      - name: Run tests
        run: pytest -q
