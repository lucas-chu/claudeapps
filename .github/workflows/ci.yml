name: clawdfather

on:
  # `pull_request` already covers branches with an open PR, so pushes only need
  # to fire on main - otherwise every push to a PR branch runs twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: clawdfather-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawdfather
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clawdfather/requirements.txt
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check app scripts tests
      - name: Format check
        run: ruff format --check app scripts tests
      - name: Test
        run: pytest tests -q
      - name: Import check
        # Catches import-time side effects (e.g. a client that phones home at
        # module scope) that unit tests would otherwise miss.
        env:
          ANTHROPIC_API_KEY: sk-test
          SLACK_BOT_TOKEN: xoxb-test
          SLACK_APP_TOKEN: xapp-test
          ENVIRONMENT_ID: env_test
          CLAWDFATHER_AGENT_ID: agent_test
          SLACK_TEAMMATE_1_BOT_TOKEN: xoxb-1
          SLACK_TEAMMATE_1_USER_ID: U111
        run: |
          python -c "
          from app import clawdfather, config, managed_agent, prompts, registry, router, slack, slack_client
          import scripts.setup, scripts.doctor
          config.require_runtime_config()
          print('imports ok')
          "
