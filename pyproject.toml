[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are caught by the formatter
    "B008",  # FastAPI-style default calls; not relevant here
]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing app modules, which needs late imports.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
