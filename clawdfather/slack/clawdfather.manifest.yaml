# Router app — this is ClawdFather, and the ONLY app that receives events.
# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
display_information:
  name: ClawdFather
  description: Hires AI teammates into this workspace.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: ClawdFather
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - channels:manage
      - chat:write
      - chat:write.customize
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
