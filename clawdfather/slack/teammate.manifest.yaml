# Teammate identity — create a few of these (three is a good starting pool),
# changing only the two names to "Teammate One" / "Teammate Two" / etc.
#
# This is a *shared* pool: ClawdFather can hire far more named teammates than
# you have identity apps — several teammates just rotate across the same
# Slack identity, posting under their own name via the `username` override.
#
# These apps never listen: no Socket Mode, no event subscriptions. Their tokens
# are used only to post, so each hired teammate speaks under its own identity.
#
# If Slack rejects `users.profile:write` as a bot scope in your workspace,
# delete that line and re-paste. The teammate will still post under its own
# name and emoji; only @-autocomplete will show the pool app's name. See
# slack/SETUP.md -> "If the rename doesn't stick".
display_information:
  name: Teammate One
  description: A hireable AI teammate. ClawdFather assigns its personality.
  background_color: "#4a154b"
features:
  bot_user:
    display_name: Teammate One
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - users.profile:write
      - reactions:write
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
